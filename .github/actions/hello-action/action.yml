name: Performance Test Action

description: Run a simple performance test

inputs:
  environment:
    description: Test environment
    required: true

  threads:
    description: Number of threads
    required: true

  run_test:
    description: Whether to run the performance test
    required: true
    default: "true"

outputs:
  test-result:
    description: Performance test result
    value: ${{ steps.test.outputs.result }}

runs:
  using: composite

  steps:
    - name: Show test parameters
      shell: bash
      run: |
        echo "Environment: ${{ inputs.environment }}"
        echo "Threads: ${{ inputs.threads }}"
        echo "Run test: ${{ inputs.run_test }}"

    - name: Run performance test
      id: test
      shell: bash
      run: |
        if [ "${{ inputs.run_test }}" = "true" ]; then
          echo "Running performance test..."
          echo "result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping performance test..."
          echo "result=skipped" >> "$GITHUB_OUTPUT"
        fi
